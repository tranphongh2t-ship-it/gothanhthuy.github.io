<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('viewer');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.01, 100);
camera.position.set(3, 2, 4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0.5, 0);
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI / 2 - 0.01;

// Lighting
const amb = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(amb);
const dir = new THREE.DirectionalLight(0xffffff, 1.0);
dir.position.set(5, 8, 5);
scene.add(dir);
const fill = new THREE.DirectionalLight(0xffffff, 0.3);
fill.position.set(-3, 4, -3);
scene.add(fill);
// Front light — illuminates standing board face (Z direction)
const frontLight = new THREE.DirectionalLight(0xffffff, 1.0);
frontLight.position.set(0, 1.5, 6);
scene.add(frontLight);

// Side light - adds depth to standing board edges
const sideLight = new THREE.DirectionalLight(0xffffff, 0.5);
sideLight.position.set(-4, 2, 3);
scene.add(sideLight);
// Back fill light - prevents dark back face
const backFill = new THREE.DirectionalLight(0xffffff, 0.4);
backFill.position.set(0, 2, -5);
scene.add(backFill);

// Spotlight (pin light shining onto board center)
const spot = new THREE.SpotLight(0xffffff, 2.0, 10, Math.PI / 6, 0.3, 1);
spot.position.set(0, 4, 0);
spot.target.position.set(0, 1, 0);
spot.castShadow = false;
scene.add(spot);
scene.add(spot.target);
let spotOn = false;
spot.visible = false;
function toggleSpot() {
  spotOn = !spotOn;
  spot.visible = spotOn;
  document.getElementById('btnSpot').classList.toggle('active', spotOn);
  // Update target to board center when visible
  if (spotOn && model) {
    const box = new THREE.Box3().setFromObject(model);
    const c = box.getCenter(new THREE.Vector3());
    spot.target.position.copy(c);
    spot.position.set(c.x, c.y + 4, c.z + 1);
  }
}

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.8 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.01;
scene.add(ground);

// Grid
const grid = new THREE.GridHelper(10, 20, 0xffffff, 0xffffff);
scene.add(grid);

// Load GLB (no embedded texture — load externally for smaller GLB files)
let model = null;
let wireframeOn = false;
const loader = new GLTFLoader();
const texLoader = new THREE.TextureLoader();
const texUrl = '../../images/as-904.webp';
loader.load('../../models/as-904/model.glb', (gltf) => {
  model = gltf.scene;
  // Apply external texture to all mesh materials
  texLoader.load(texUrl, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    model.traverse((child) => {
      if (child.isMesh) {
        if (Array.isArray(child.material)) {
          child.material.forEach(m => { m.map = tex; m.color.set(0xffffff); m.needsUpdate = true; });
        } else {
          child.material.map = tex;
          child.material.color.set(0xffffff);
          child.material.needsUpdate = true;
        }
      }
    });
  }, undefined, (e) => console.warn('Texture load error:', e));
  scene.add(model);
  // Start standing (rotate flat board upright)
  model.rotation.x = -Math.PI / 2;
  // Lift board so bottom edge sits on ground (Y=0)
  const box0 = new THREE.Box3().setFromObject(model);
  model.position.y = -box0.min.y;
  // Auto frame — show full board height prominently
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const fov = camera.fov * Math.PI / 180;
  const halfH = size.y / 2;
  const distVert = halfH / Math.tan(fov / 2);
  const halfW = size.x / 2;
  const distHoriz = halfW / Math.tan(fov / 2);
  const dist = Math.max(distVert, distHoriz) * 1.2;
  camera.position.set(center.x + dist * 0.15, center.y, center.z + dist);
  controls.target.copy(center);
}, undefined, (err) => {
  console.error('GLB load error:', err);
});

function resetCamera() {
  if (!model) return;
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const fov = camera.fov * Math.PI / 180;
  const halfH = size.y / 2;
  const distVert = halfH / Math.tan(fov / 2);
  const halfW = size.x / 2;
  const distHoriz = halfW / Math.tan(fov / 2);
  const dist = Math.max(distVert, distHoriz) * 1.3;
  camera.position.set(center.x + dist * 0.15, center.y + halfH * 0.2, center.z + dist);
  controls.target.copy(center);
}

function toggleWireframe() {
  wireframeOn = !wireframeOn;
  if (model) {
    model.traverse((child) => {
      if (child.isMesh) child.material.wireframe = wireframeOn;
    });
  }
}

function animate() {
  requestAnimationFrame(animate);
  // Clamp camera: never go below board (y=0)
  if (camera.position.y < 0.1) camera.position.y = 0.1;
  if (controls.target.y < 0) controls.target.y = 0;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

let isNight = false;
function toggleDayNight() {
  isNight = !isNight;
  scene.background = new THREE.Color(isNight ? 0x1a1a1a : bgColorHex);
  amb.intensity = isNight ? 0.3 : 0.6;
  dir.intensity = isNight ? 0.5 : 1.0;
  fill.intensity = isNight ? 0.15 : 0.3;
  ground.material.color.set(isNight ? 0x111111 : 0xf0f0f0);
  const t2 = document.getElementById('btnDayNight2');
  if (t2) t2.textContent = isNight ? '☀️ Ban ngày' : '🌙 Ban đêm';
}
let autoRotate = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;
function toggleAutoRotate() {
  autoRotate = !autoRotate;
  controls.autoRotate = autoRotate;
  document.getElementById('btnAutoRotate').classList.toggle('active', autoRotate);
}
// Dimension lines removed — cleaner look
let isStanding = true;
function toggleOrientation() {
  if (!model) return;
  isStanding = !isStanding;
  model.rotation.set(0, 0, 0);
  model.position.y = 0;
  if (isStanding) {
    model.rotation.x = -Math.PI / 2;
    // Lift so bottom sits on ground
    const b = new THREE.Box3().setFromObject(model);
    model.position.y = -b.min.y;
  }
  document.getElementById('btnOrientation').textContent = isStanding ? '📐 Nằm' : '📐 Đứng';
  resetCamera();
}
function zoomIn() {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  camera.position.addScaledVector(dir, 0.5);
  controls.target.addScaledVector(dir, 0.5);
  controls.update();
}
function zoomOut() {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  camera.position.addScaledVector(dir, -0.5);
  controls.target.addScaledVector(dir, -0.5);
  controls.update();
}
let gridVisible = true;
let gridObj = grid;
function toggleGrid() {
  gridVisible = !gridVisible;
  gridObj.visible = gridVisible;
  document.getElementById('btnGrid').classList.toggle('active', gridVisible);
}
function changeGridColor(hex) {
  const c = new THREE.Color(hex);
  const mats = Array.isArray(gridObj.material) ? gridObj.material : [gridObj.material];
  mats.forEach(m => { m.color.copy(c); });
}
function changeGridOpacity(val) {
  const op = val / 100;
  const mats = Array.isArray(gridObj.material) ? gridObj.material : [gridObj.material];
  mats.forEach(m => { m.transparent = op < 1; m.opacity = op; m.needsUpdate = true; });
}
changeGridColor('#ffffff');
changeGridOpacity(30);

let bgColorHex = 0xffffff;
function changeBg(hex) {
  bgColorHex = parseInt(hex.replace('#',''), 16);
  if (!isNight) scene.background = new THREE.Color(bgColorHex);
}
window.resetCamera = resetCamera;
window.toggleWireframe = toggleWireframe;
window.toggleDayNight = toggleDayNight;
window.toggleAutoRotate = toggleAutoRotate;
window.toggleOrientation = toggleOrientation;
window.zoomIn = zoomIn;
window.zoomOut = zoomOut;
window.toggleGrid = toggleGrid;
window.changeGridColor = changeGridColor;
window.changeGridOpacity = changeGridOpacity;
window.changeBg = changeBg;
window.toggleSpot = toggleSpot;

// Mobile panel toggles
function toggleInfoPanel() {
  const panel = document.getElementById('infoPanel');
  const qr = document.getElementById('qrPanel');
  qr.classList.remove('mobile-open');
  panel.classList.toggle('mobile-open');
}
function toggleQrPanel() {
  const panel = document.getElementById('qrPanel');
  const info = document.getElementById('infoPanel');
  info.classList.remove('mobile-open');
  panel.classList.toggle('mobile-open');
}
window.toggleInfoPanel = toggleInfoPanel;
window.toggleQrPanel = toggleQrPanel;
</script>
